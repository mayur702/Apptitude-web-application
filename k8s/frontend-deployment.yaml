apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: apptitude
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mayur702/apptitude-web-application:v1
        ports:
        - containerPort: 80
        
