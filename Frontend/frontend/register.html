<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-4 text-center">Register</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Name" class="w-full p-2 border rounded mb-2" required>
            <input type="text" id="mobile_no" placeholder="Mobile No" class="w-full p-2 border rounded mb-2" required>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded mb-2" required>
            
            <!-- Role Selection -->
            <select id="role" class="w-full p-2 border rounded mb-2" required>
                <option value="" disabled selected>Select Role</option>
                <option value="admin">Admin</option>
                <option value="student">Student</option>
            </select>

            <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded mb-2" required>
            <input type="password" id="confirm_password" placeholder="Confirm Password" class="w-full p-2 border rounded mb-2" required>
            
            <button type="submit" class="w-full bg-green-500 text-white p-2 rounded">Register</button>
        </form>
        <p class="text-center mt-4">Already have an account? <a href="index.html" class="text-blue-500">Login</a></p>
    </div>
    <script src="frontend/scripts/auth.js"></script>
</body>
</html>
