<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center py-4 text-2xl font-bold shadow-md">
        Add New Question
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6">
        <div class="max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-lg">
            <form id="questionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Question Input -->
                <div class="md:col-span-2">
                    <label class="block text-gray-700 font-semibold mb-1">Question:</label>
                    <textarea id="question_text" class="w-full p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500" placeholder="Enter the question" required></textarea>
                </div>

                <!-- Options -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">Option A:</label>
                    <input type="text" id="option_a" class="w-full p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500" placeholder="Option A" required>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">Option B:</label>
                    <input type="text" id="option_b" class="w-full p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500" placeholder="Option B" required>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">Option C:</label>
                    <input type="text" id="option_c" class="w-full p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500" placeholder="Option C" required>
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">Option D:</label>
                    <input type="text" id="option_d" class="w-full p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500" placeholder="Option D" required>
                </div>

                <!-- Correct Option Selection -->
                <div class="md:col-span-2">
                    <label class="block text-gray-700 font-semibold mb-1">Correct Option:</label>
                    <select id="correct_option" class="w-full p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500" required>
                        <option value="a">Option A</option>
                        <option value="b">Option B</option>
                        <option value="c">Option C</option>
                        <option value="d">Option D</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="w-full md:w-auto bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition duration-300">
                        Upload Question
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-3 text-sm mt-6">
        <a href="dashboard.html" class="underline hover:text-gray-400 transition duration-200">← Back to Dashboard</a>
    </footer>

    <script src="main/questions.js"></script>
</body>
</html>
