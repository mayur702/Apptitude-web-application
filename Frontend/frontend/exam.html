<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white text-center py-4 text-3xl font-bold shadow-md">
        Aptitude Exam
    </header>

    <!-- Timer Display -->
    <div class="flex justify-center mt-4">
        <div class="bg-gray-200 px-6 py-3 rounded-full text-lg font-semibold">
            Time Left: <span id="timer" class="text-red-500">30:00</span>
        </div>
    </div>

    <!-- Exam Container -->
    <main class="flex-1 p-6">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold text-center mb-4">Answer the questions below:</h2>
            
            <div id="examContainer" class="space-y-6">
                <p class="text-center text-gray-500">Loading questions...</p>
            </div>

            <!-- Submit Button -->
            <div class="text-center mt-6">
                <button id="submitExam" class="bg-green-500 text-white text-lg font-bold px-6 py-3 rounded-lg hover:bg-green-600 transition duration-300 shadow-md hidden">
                    Submit Exam
                </button>
            </div>
        </div>
    </main>

    <script src="main\exam.js"></script>
</body>
</html>
